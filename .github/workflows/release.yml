name: "Release"

permissions:
  contents: write

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish to GitHub Release"
        required: false
        default: "false"
        type: boolean

jobs:
  build-windows:
    name: Build Windows
    if: ${{ !github.event.pull_request && github.ref_type != 'tag' }}
    strategy:
      fail-fast: false
      matrix:
        lang: [zh_en]

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust latest
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install frontend dependencies
        shell: bash
        run: |
          pnpm install
          pnpm approve-builds esbuild
          pnpm approve-builds --all

      - name: Install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: canary

      - name: Confirm language
        env:
          MATRIX_LANG: ${{ matrix.lang }}
        shell: bash
        run: deno run -A script/lang.ts

      - name: Install bun
        uses: oven-sh/setup-bun@v1

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Windows artifacts
        env:
          MATRIX_LANG: ${{ matrix.lang }}
          TRAN_VERSION: ${{ steps.version.outputs.VERSION }}
          TRAN_PLATFORM: "windows"
        shell: bash
        run: deno run -A script/built-windows.ts

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tran-windows-${{ matrix.lang }}-${{ github.run_id }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish release
    if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') }}
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tran-windows-*
          path: release
          merge-multiple: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Tran ${{ steps.version.outputs.VERSION }}
          body: |
            Automated Windows build for ${{ steps.version.outputs.VERSION }}
          files: release/*
          draft: true
          prerelease: false

